  <line x1="9" y1="21" x2="23" y2="21" stroke="#C9622C" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
  <circle cx="16" cy="9" r="4.2" fill="#C9622C"/>
  <circle cx="9" cy="21" r="3.4" fill="#E3956B"/>
  <circle cx="23" cy="21" r="3.4" fill="#E3956B"/>
</svg>
